<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Thomas Müller — WMA Service GmbH</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#eef0f1;
    --surface:#ffffff;
    --line:#e1e4e6;
    --text:#2b3640;
    --muted:#8a949e;
    --rot:#e1161c;
    --orange:#fb7d0c;
    --raster:#d9dde1;
    box-sizing:border-box;
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
  }
  *{box-sizing:inherit;}
  html{scroll-padding-top:env(safe-area-inset-top,0px);}
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#14181b;
      --surface:#1c2226;
      --line:#2c3338;
      --text:#eceeef;
      --muted:#9aa4ab;
      --raster:#333b40;
    }
  }
  :root[data-theme="dark"]{
    --bg:#14181b;
    --surface:#1c2226;
    --line:#2c3338;
    --text:#eceeef;
    --muted:#9aa4ab;
    --raster:#333b40;
  }
  html,body{height:100%;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:'Inter',system-ui,sans-serif;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:32px 18px;
    line-height:1.5;
  }
  .card{
    width:100%;
    max-width:400px;
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:6px;
    padding:0 0 28px;
    position:relative;
    overflow:hidden;
    box-shadow:0 1px 2px rgba(43,54,64,0.06);
  }
  .flame-strip{
    height:5px;
    background:linear-gradient(90deg,var(--rot) 0%, var(--rot) 55%, var(--orange) 55%, var(--orange) 100%);
  }
  .logo-row{
    padding:26px 28px 18px;
    display:flex;
    justify-content:center;
  }
  .logo-row img{
    height:34px;
    width:auto;
  }
  .who{
    text-align:center;
    padding:0 28px 22px;
  }
  .who h1{
    font-family:'Poppins',sans-serif;
    font-weight:700;
    font-size:22px;
    margin:0 0 3px;
    letter-spacing:-0.01em;
  }
  .who .role{
    font-size:14px;
    color:var(--rot);
    font-weight:600;
    margin:0;
  }
  .qr-wrap{
    background:#ffffff;
    padding:14px;
    width:150px;
    height:150px;
    margin:0 auto 10px;
    display:flex;
    align-items:center;
    justify-content:center;
    border:1px solid var(--raster);
    opacity:0;
    transform:scale(0.96);
    transition:opacity 0.45s ease, transform 0.45s ease;
  }
  .qr-wrap.ready{opacity:1;transform:scale(1);}
  .qr-wrap svg{width:100%;height:100%;display:block;}
  .qr-caption{
    text-align:center;
    font-size:12px;
    color:var(--muted);
    margin:0 0 24px;
  }
  .actions{
    padding:0 28px;
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
    margin-bottom:22px;
  }
  .action{
    display:flex;
    align-items:center;
    gap:9px;
    padding:12px 13px;
    border:1px solid var(--line);
    border-radius:5px;
    text-decoration:none;
    color:var(--text);
    font-size:13.5px;
    font-weight:500;
    transition:border-color 0.2s ease, background 0.2s ease;
    background:transparent;
    cursor:pointer;
    font-family:inherit;
  }
  .action:hover{border-color:var(--rot);}
  .action svg{flex:0 0 auto;width:17px;height:17px;}
  .action.whatsapp svg{color:#25D366;}
  .action.call svg{color:var(--rot);}
  .action.mail svg{color:var(--orange);}
  .action.route svg{color:var(--muted);}
  .details{
    margin:0 28px 20px;
    border-top:1px solid var(--line);
    padding-top:16px;
    font-size:13.5px;
    color:var(--muted);
    text-align:center;
  }
  .details strong{color:var(--text);font-weight:500;}
  .save-btn{
    display:block;
    margin:0 28px;
    background:var(--rot);
    color:#fff;
    border:none;
    border-radius:5px;
    padding:14px 16px;
    font-family:'Inter',sans-serif;
    font-size:14.5px;
    font-weight:600;
    text-align:center;
    cursor:pointer;
    width:calc(100% - 56px);
    transition:filter 0.2s ease;
  }
  .save-btn:hover{filter:brightness(1.08);}
  .foot{
    margin:18px 28px 0;
    font-size:11px;
    color:var(--muted);
    text-align:center;
  }
  :focus-visible{outline:2px solid var(--rot);outline-offset:2px;}
  @media (prefers-reduced-motion: reduce){
    .qr-wrap{transition:none;}
  }
</style>
</head>

      var unicodeMap = {};
      while (true) {
        var b0 = bin.read();
        if (b0 == -1) break;
        var b1 = read();
        var b2 = read();
        var b3 = read();
        var k = String.fromCharCode( (b0 << 8) | b1);
        var v = (b2 << 8) | b3;
        unicodeMap[k] = v;
        count += 1;

      if (count != numChars) {
        throw count + ' != ' + numChars;
      }

      return unicodeMap;
    }();

      var bytes = [];
      for (var i = 0; i < s.length; i += 1) {
        var c = s.charCodeAt(i);
        if (c < 128) {
          bytes.push(c);
        } else {

              bytes.push(b & 0xff);

          }

<script>
  const vcard =
`BEGIN:VCARD
VERSION:3.0
N:Müller;Thomas;;;
FN:Thomas Müller
ORG:WMA Service GmbH

TEL;TYPE=WORK,VOICE:+493921 4837279
EMAIL;TYPE=WORK:info@wmaservice.net
ADR;TYPE=WORK:;;Bruchstr. 7;Burg;;39288;Deutschland
END:VCARD`;

  const qrWrap = document.getElementById('qrWrap');
  try {
    const qr = qrcode(0, 'M');
    qr.addData(vcard);
    qr.make();
    let svg = qr.createSvgTag(4, 8);
    svg = svg.replace('fill="black"', 'fill="#2b3640"');
    qrWrap.innerHTML = svg;

    qrWrap.textContent = "QR-Code konnte nicht geladen werden.";
    qrWrap.style.color = "#2b3640";
    qrWrap.style.fontSize = "12px";
    qrWrap.style.padding = "10px";

  document.getElementById('saveBtn').addEventListener('click', () => {
    const blob = new Blob([vcard], { type: 'text/vcard;charset=utf-8' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'thomas-mueller-wma-service.vcf';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(() => URL.revokeObjectURL(url), 2000);
